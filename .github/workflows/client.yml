name: Client bauen

# Läuft, wenn auf GitHub ein Release veröffentlicht wird (Tag vX.Y.Z).
# Manuell startbar: ohne Tag = Test-Build (nur Artefakte), mit Tag = bestehendes
# Release neu bauen und die Installer daran anhängen (z. B. nach einem abgebrochenen Lauf).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehendes Release neu bauen (z. B. v1.0.2) – leer lassen für Test-Build'
        required: false
        default: ''

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

# Standard: nur lesen. Schreibrecht hat nur der Release-Job (siehe unten).
permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15   # Apple Silicon; fest statt macos-latest (dort oft keine freien Runner)
            type: dmg
            # Bundle-Name (Menüleiste) max. 16 Zeichen; .app-Datei heißt weiter TrainingListmanager.app
            extra: --mac-package-name "TL Manager" --icon client/packaging/TrainingListmanager.icns
          - os: windows-latest
            type: msi
            extra: --win-menu --win-shortcut --win-dir-chooser --win-menu-group TrainingListmanager --win-upgrade-uuid 6c3b2a3e-8f43-4d9a-9a8e-3f2f6a1c7d41 --icon client/packaging/TrainingListmanager.ico
          - os: ubuntu-latest
            type: deb
            extra: --linux-shortcut --linux-menu-group Office --linux-package-name traininglistmanager --icon client/packaging/TrainingListmanager.png
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      # JDK 27 mit eingebautem JavaFX 27 – jpackage übernimmt die JavaFX-Module direkt in die Laufzeit
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '27'
          java-package: jdk+fx
          cache: maven

      # Beim Release bestimmt dessen Tag vX.Y.Z die Version (wichtig für das Software-Update im Client),
      # beim Test-Build die Version aus client/pom.xml.
      - name: Version ermitteln
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [ -n "$TAG" ]; then
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release-Tag '$TAG' hat nicht das Format vX.Y.Z (z. B. v1.0.1)."
              exit 1
            fi
            V="${TAG#v}"
            mvn -B -q -f client/pom.xml versions:set -DnewVersion="$V" -DgenerateBackupPoms=false
          else
            V=$(mvn -B -q -f client/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
            V="${V%-SNAPSHOT}"
          fi
          echo "Version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Maven-Build
        run: mvn -B -f client/pom.xml package

      - name: Installer erzeugen (jpackage)
        run: |
          mkdir -p dist
          jpackage \
            --type ${{ matrix.type }} \
            --name TrainingListmanager \
            --app-version ${{ steps.version.outputs.version }} \
            --vendor "mind-architects" \
            --description "Trainings verwalten und Einladungen versenden" \
            --input client/target/libs \
            --main-jar training-listmanager.jar \
            --main-class de.mindarchitects.tlm.Launcher \
            --add-modules java.base,java.desktop,java.logging,java.naming,java.net.http,java.prefs,java.security.sasl,java.sql,java.xml,jdk.net,jdk.security.auth,jdk.unsupported,jdk.localedata,jdk.charsets,javafx.base,javafx.graphics,javafx.controls \
            --jlink-options "--strip-debug --no-man-pages --no-header-files" \
            --java-options "-Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED,javafx.graphics" \
            --java-options "-Dapp.version=${{ steps.version.outputs.version }}" \
            --dest dist \
            ${{ matrix.extra }}
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrainingListmanager-${{ matrix.type }}
          path: dist/*
          if-no-files-found: error

  # Nur beim Release: Installer an das Release hängen.
  release:
    needs: package
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: An Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
