name: Client bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['client/**', '.github/workflows/client.yml']
  workflow_dispatch:

# Standard: nur lesen. Schreibrecht hat nur der Release-Job (siehe unten).
permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            type: dmg
            extra: --mac-package-name TrainingListmanager --icon client/packaging/TrainingListmanager.icns
          - os: windows-latest
            type: msi
            extra: --win-menu --win-shortcut --win-dir-chooser --win-menu-group TrainingListmanager --win-upgrade-uuid 6c3b2a3e-8f43-4d9a-9a8e-3f2f6a1c7d41 --icon client/packaging/TrainingListmanager.ico
          - os: ubuntu-latest
            type: deb
            extra: --linux-shortcut --linux-menu-group Office --linux-package-name traininglistmanager --icon client/packaging/TrainingListmanager.png
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # JDK 27 mit eingebautem JavaFX 27 – jpackage übernimmt die JavaFX-Module direkt in die Laufzeit
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: '27'
          java-package: jdk+fx
          cache: maven

      # Bei einem Tag vX.Y.Z bestimmt der Tag die Version (wichtig für das Software-Update im Client),
      # sonst die Version aus client/pom.xml.
      - name: Version ermitteln
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            mvn -B -q -f client/pom.xml versions:set -DnewVersion="$V" -DgenerateBackupPoms=false
          else
            V=$(mvn -B -q -f client/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
            V="${V%-SNAPSHOT}"
          fi
          echo "Version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Maven-Build
        run: mvn -B -f client/pom.xml package

      - name: Installer erzeugen (jpackage)
        run: |
          mkdir -p dist
          jpackage \
            --type ${{ matrix.type }} \
            --name TrainingListmanager \
            --app-version ${{ steps.version.outputs.version }} \
            --vendor "mind-architects" \
            --description "Trainings verwalten und Einladungen versenden" \
            --input client/target/libs \
            --main-jar training-listmanager.jar \
            --main-class de.mindarchitects.tlm.Launcher \
            --add-modules java.base,java.desktop,java.logging,java.naming,java.net.http,java.prefs,java.security.sasl,java.sql,java.xml,jdk.net,jdk.security.auth,jdk.unsupported,jdk.localedata,jdk.charsets,javafx.base,javafx.graphics,javafx.controls \
            --jlink-options "--strip-debug --no-man-pages --no-header-files" \
            --java-options "-Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED,javafx.graphics" \
            --java-options "-Dapp.version=${{ steps.version.outputs.version }}" \
            --dest dist \
            ${{ matrix.extra }}
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TrainingListmanager-${{ matrix.type }}
          path: dist/*
          if-no-files-found: error

  # Nur bei Tags vX.Y.Z: Installer signieren (Ed25519) und an ein GitHub-Release hängen.
  # Der Client installiert Updates nur mit gültiger Signatur.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: '27'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Installer signieren
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Secret UPDATE_SIGNING_KEY fehlt – Release wird nicht veröffentlicht (Clients würden das Update ablehnen)."
            exit 1
          fi
          java client/packaging/SignRelease.java sign dist/*
          ls -la dist

      - name: An Release anhängen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
